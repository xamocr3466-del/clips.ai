[project]
name = "clipstudio"
version = "0.1.0"
description = "Free local speech-aware video clips for YouTube Shorts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "yt-dlp[default]>=2026.3.17",
  "faster-whisper>=1.1,<2",
  "av>=11,<19",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
